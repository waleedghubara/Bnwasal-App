<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" fill="none">
  <circle cx="100" cy="90" r="80" fill="url(#offersBg)" opacity="0.15"/>
  <defs>
    <linearGradient id="offersBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <!-- Shipment box -->
  <rect x="60" y="20" width="80" height="55" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="70" y="28" width="60" height="4" rx="2" fill="#334155"/>
  <rect x="70" y="37" width="45" height="4" rx="2" fill="#334155"/>
  <rect x="70" y="46" width="30" height="4" rx="2" fill="#334155"/>
  <!-- Box tape -->
  <line x1="90" y1="20" x2="90" y2="75" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="110" y1="20" x2="110" y2="75" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Price tag 1 -->
  <path d="M25 100 Q25 88 37 88 L75 88 Q87 88 87 100 L87 115 Q87 127 75 127 L37 127 Q25 127 25 115 Z" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="37" y="105" fill="#10b981" font-family="sans-serif" font-size="9" font-weight="bold">25 ر.س</text>
  <text x="37" y="119" fill="#64748b" font-family="sans-serif" font-size="6">كابتن أحمد</text>
  <circle cx="80" cy="118" r="6" fill="#10b981" opacity="0.2"/>
  <circle cx="80" cy="118" r="3" fill="#10b981"/>
  <polygon points="78,116 83,118 78,120" fill="#fff" transform="rotate(90 80 118)"/>

  <!-- Price tag 2 -->
  <path d="M113 105 Q113 93 125 93 L163 93 Q175 93 175 105 L175 120 Q175 132 163 132 L125 132 Q113 132 113 120 Z" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="125" y="110" fill="#f59e0b" font-family="sans-serif" font-size="9" font-weight="bold">30 ر.س</text>
  <text x="125" y="124" fill="#64748b" font-family="sans-serif" font-size="6">كابتن محمود</text>

  <!-- Comparison arrows -->
  <path d="M95 95 L90 100 L95 105" stroke="#64748b" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M105 95 L110 100 L105 105" stroke="#64748b" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bottom badge -->
  <rect x="55" y="150" width="90" height="18" rx="9" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
  <text x="65" y="162" fill="#94a3b8" font-family="sans-serif" font-size="8">اختر العرض الأنسب</text>
</svg>
