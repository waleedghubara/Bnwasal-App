<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" fill="none">
  <circle cx="100" cy="90" r="80" fill="url(#trackingBg)" opacity="0.15"/>
  <defs>
    <linearGradient id="trackingBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <!-- Map background -->
  <rect x="25" y="35" width="150" height="120" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <!-- Grid lines (map) -->
  <line x1="25" y1="65" x2="175" y2="65" stroke="#334155" stroke-width="0.8"/>
  <line x1="25" y1="95" x2="175" y2="95" stroke="#334155" stroke-width="0.8"/>
  <line x1="50" y1="35" x2="50" y2="155" stroke="#334155" stroke-width="0.8"/>
  <line x1="100" y1="35" x2="100" y2="155" stroke="#334155" stroke-width="0.8"/>
  <line x1="150" y1="35" x2="150" y2="155" stroke="#334155" stroke-width="0.8"/>
  <!-- Route path -->
  <path d="M55 130 L70 100 L95 110 L120 75 L140 55" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8"/>
  <!-- Origin pin -->
  <ellipse cx="55" cy="134" rx="6" ry="6" fill="#10b981" opacity="0.3"/>
  <circle cx="55" cy="130" r="5" fill="#10b981"/>
  <circle cx="55" cy="130" r="2" fill="#fff"/>
  <!-- Destination pin -->
  <ellipse cx="140" cy="59" rx="6" ry="6" fill="#ef4444" opacity="0.3"/>
  <circle cx="140" cy="55" r="5" fill="#ef4444"/>
  <circle cx="140" cy="55" r="2" fill="#fff"/>
  <!-- Moving dot (captain) -->
  <circle cx="95" cy="110" r="6" fill="#3b82f6" stroke="#fff" stroke-width="2"/>
  <circle cx="95" cy="110" r="2" fill="#fff"/>
  <!-- Live pulse ring -->
  <circle cx="95" cy="110" r="10" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.5">
    <animate attributeName="r" values="6;14;6" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
  <!-- Bottom label area -->
  <rect x="55" y="160" width="90" height="18" rx="9" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
  <circle cx="67" cy="169" r="3" fill="#10b981"/>
  <text x="75" y="173" fill="#94a3b8" font-family="sans-serif" font-size="8" font-weight="500">تتبع مباشر</text>
  <text x="120" y="173" fill="#3b82f6" font-family="sans-serif" font-size="7">LIVE</text>
</svg>
