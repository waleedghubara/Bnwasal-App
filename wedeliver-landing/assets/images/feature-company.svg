<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" fill="none">
  <circle cx="100" cy="90" r="80" fill="url(#companyBg)" opacity="0.15"/>
  <defs>
    <linearGradient id="companyBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <!-- Truck body -->
  <rect x="35" y="75" width="100" height="55" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <!-- Truck cargo area -->
  <rect x="40" y="80" width="65" height="45" rx="4" fill="#334155"/>
  <!-- Package in truck -->
  <rect x="48" y="88" width="25" height="18" rx="3" fill="#2563eb" opacity="0.8"/>
  <line x1="55" y1="88" x2="55" y2="106" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="78" y="92" width="18" height="14" rx="2" fill="#7c3aed" opacity="0.8"/>
  <!-- Truck cabin -->
  <path d="M135 80 L145 80 Q155 80 155 90 L155 130 L135 130 Z" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <!-- Windshield -->
  <path d="M138 84 L148 84 Q152 84 152 88 L152 95 L138 95 Z" fill="#2563eb" opacity="0.3"/>
  <!-- Truck wheels -->
  <ellipse cx="65" cy="134" rx="12" ry="6" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <circle cx="65" cy="134" r="4" fill="#475569"/>
  <ellipse cx="125" cy="134" rx="12" ry="6" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <circle cx="125" cy="134" r="4" fill="#475569"/>

  <!-- Road line -->
  <line x1="20" y1="142" x2="180" y2="142" stroke="#334155" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- Merchant icon (left) -->
  <circle cx="30" cy="50" r="18" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="30" cy="45" r="5" fill="#10b981" opacity="0.6"/>
  <circle cx="30" cy="45" r="2" fill="#fff"/>
  <rect x="22" y="53" width="16" height="10" rx="3" fill="#10b981" opacity="0.4"/>
  <text x="21" y="44" fill="#10b981" font-family="sans-serif" font-size="6" font-weight="bold">تاجر</text>

  <!-- Captain icon (right) -->
  <circle cx="170" cy="50" r="18" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="170" cy="45" r="5" fill="#f59e0b" opacity="0.6"/>
  <circle cx="170" cy="45" r="2" fill="#fff"/>
  <rect x="162" y="53" width="16" height="10" rx="3" fill="#f59e0b" opacity="0.4"/>
  <text x="158" y="44" fill="#f59e0b" font-family="sans-serif" font-size="6" font-weight="bold">كابتن</text>

  <!-- Arrow between merchant and captain -->
  <path d="M48 50 L70 50" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 2"/>
  <polygon points="68,46 74,50 68,54" fill="#64748b"/>
  <path d="M130 50 L152 50" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 2"/>
  <polygon points="150,46 156,50 150,54" fill="#64748b"/>

  <!-- Bottom label -->
  <rect x="55" y="155" width="90" height="18" rx="9" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
  <text x="72" y="168" fill="#94a3b8" font-family="sans-serif" font-size="8">منصة بنوصل للتوصيل</text>
</svg>
